<div id="previewContainer">
  <div class="top-bar">
    <div class="preview-box">
      <img id="closePreviewButton" src="../assets/ui/Back_Button.png" />
      <img id="imagePreview" />
      <video id="videoPreview" playsinline loop></video>
      <button id="toggleMuteButton" class="style-reset icon-button">
        <img id="muteButtonImg" src="//cdn.8thwall.com/web/img/mediarecorder/sound-on-v1.svg" />
      </button>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="finalize-container">
      <div id="finalizeText"></div>
      <progress id="finalizeProgressBar" value="0" max="100"></progress>
    </div>
    <div id="openSafariText" class="style-reset">Downloading is only available in Safari</div>
    <div id="tapAndHoldText" class="style-reset">Tap + Hold to Share</div>
    <div class="flex centerContent justify-evenly width100 flex-wrap mb1">
      <div id="downloadButton" class="width40 button mx-auto relative">
        <p id="downloadButtonText" class="relative zi1 margin0 fw700 black-mmalika-font">Download</p>
      </div>
      <div id="actionButton" class="width40 button mx-auto relative">
        <p id="actionButtonText" class="relative zi1 margin0 fw700 black-mmalika-font">Share</p>
      </div>
    </div>
  </div>
</div>
